<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Jecidt — Welcome to Gotham</title><desc id="desc">A cinematic midnight skyline with a glowing bat signal and neon blue technology accents.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050811"/><stop offset=".48" stop-color="#101b36"/><stop offset="1" stop-color="#090d19"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c6f7ff" stop-opacity=".34"/><stop offset="1" stop-color="#58c9ff" stop-opacity="0"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#53d9ff" stop-opacity="0"/><stop offset=".5" stop-color="#53d9ff"/><stop offset="1" stop-color="#53d9ff" stop-opacity="0"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#f2fcff" stop-opacity=".95"/><stop offset=".25" stop-color="#b7efff" stop-opacity=".42"/><stop offset="1" stop-color="#83dfff" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
